plugins { id 'com.android.application' }

android {
    namespace 'com.pathyourday.path'
    compileSdk 35
    defaultConfig {
        applicationId 'com.pathyourday.path.preview'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0-preview.1'
    }
    sourceSets.main.assets.srcDirs = ['../../generated']
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
