<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Path · Data compatibility preview</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../typography.css"><link rel="stylesheet" href="../actions.css"><link rel="stylesheet" href="../numeric-picker.css"><link rel="stylesheet" href="preview.css">
<script type="module" src="preview.mjs"></script></head>
<body><main class="compat-shell">
<header class="compat-header"><span class="brand">P<span>ATH</span><small> / DATA LAB</small></span><label><span class="sr-only" data-text="language"></span><select id="preview-language" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option><option value="es">Español</option></select></label></header>
<h1 data-text="heading"></h1><p class="compat-lead" data-text="intro"></p>
<section class="compat-card"><h2 data-text="source"></h2><p data-text="scope"></p><div class="compat-toolbar"><select id="fixture-kind" aria-label="Synthetic fixture"><option value="desktop-v2.json">Plain v2</option><option value="desktop-pooled-v2.json">Pooled codec 2 + history</option></select><button id="load-fixture" class="action-button action-button--create" data-text="sample"></button></div><label for="checkpoint-file" data-text="choose"></label><input id="checkpoint-file" type="file" accept=".json,application/json"><p class="muted" data-text="limit"></p><p id="source-name" class="muted"></p><p id="file-error" class="error" role="alert" hidden></p></section>
<section id="report" class="compat-card" hidden aria-labelledby="report-heading"><h2 id="report-heading" data-text="inspection"></h2><p id="format-summary"></p><p id="verdict" role="status"></p><div class="table-scroll"><table id="counts"><caption data-text="counts"></caption><thead><tr><th data-text="section"></th><th data-text="objects"></th><th data-text="editable"></th><th data-text="view"></th><th data-text="opaque"></th></tr></thead><tbody></tbody></table></div><p id="capability-note" data-text="capabilityNote"></p><h3 data-text="diagnostics"></h3><ul id="issues"></ul><details><summary data-text="unsupported"></summary><ul id="opaque-fields"></ul><p id="opaque-scopes"></p></details></section>
<section id="experiment" class="compat-card" hidden aria-labelledby="experiment-heading"><h2 id="experiment-heading" data-text="experiment"></h2><p data-text="copyOnly"></p><label for="entity-kind" data-text="section"></label><select id="entity-kind"></select><label for="entity-record" data-text="record"></label><select id="entity-record"></select><h3 id="entity-title"></h3><p id="entity-mode"></p><p id="main-preview"></p><form id="copy-form" novalidate><fieldset id="copy-fields"></fieldset><p id="edit-error" class="error" role="alert" hidden></p><button id="apply-copy" class="primary" type="submit" data-text="apply"></button></form><p id="operation-status" role="status"></p><details><summary data-text="raw"></summary><pre id="source-record" tabindex="0"></pre></details></section>
<section class="compat-card"><h2 data-text="result"></h2><p data-text="resultNote"></p><div class="compat-toolbar"><button id="export-copy" class="action-button action-button--secondary" disabled data-text="export"></button><button id="reset-copy" class="action-button action-button--secondary" disabled data-text="reset"></button></div></section>
</main></body></html>
