name: Path native previews
on:
  push:
    branches: [test/native-preview-20261123]
    paths: ['mobile-native/**', '.github/workflows/path-native-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: path-native-preview-${{ github.sha }}
  cancel-in-progress: true
jobs:
  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile pinned web assets
        working-directory: mobile-native
        run: |
          npm install --no-package-lock --no-audit --no-fund esbuild@0.28.2
          node tools/build-shell.cjs
          cp bundle/OPEN-SOURCE-LICENSES.txt generated/
      - uses: actions/upload-artifact@v4
        with:
          name: preview-shell
          path: mobile-native/generated/
          retention-days: 7
  android:
    needs: shell
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: preview-shell
          path: mobile-native/generated
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK if missing
        run: |
          if [[ ! -d "$ANDROID_HOME/platforms/android-35" || ! -d "$ANDROID_HOME/build-tools/35.0.0" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Reuse the preview signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: path-preview-debug-signing-v1
      - name: Build the installable APK
        run: gradle --no-daemon -p mobile-native/android :app:assembleDebug
      - name: Verify signature, package and embedded shell
        run: |
          APK=mobile-native/android/app/build/outputs/apk/debug/app-debug.apk
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.pathyourday.path.preview'"
          unzip -p "$APK" assets/shell.html | cmp - mobile-native/generated/shell.html
          mkdir -p artifacts
          cp "$APK" artifacts/Path-Android-Preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Path-Android-Preview
          path: artifacts/Path-Android-Preview.apk
          retention-days: 30
  android-launch:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Path-Android-Preview
          path: artifacts
      - name: Boot a clean Android emulator
        shell: bash
        run: |
          set -eo pipefail
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          image='system-images;android-35;google_apis;x86_64'
          "$sdk/sdkmanager" "$image" emulator platform-tools
          echo no | "$sdk/avdmanager" create avd --force -n path-preview -k "$image"
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd path-preview -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          for n in {1..120}; do [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]] && break; sleep 2; done
          adb shell input keyevent 82
          adb install artifacts/Path-Android-Preview.apk
          adb shell svc wifi disable
          adb shell svc data disable
          adb shell am start -W -n com.pathyourday.path.preview/com.pathyourday.path.MainActivity
          for n in {1..24}; do
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            if adb shell cat /sdcard/window.xml 2>/dev/null | grep -Eq '(Войти в Path|Sign in to Path|Вход в Path)'; then
              echo 'The installed APK rendered the bundled sign-in screen offline.'
              exit 0
            fi
            sleep 2
          done
          adb shell cat /sdcard/window.xml || true
          exit 1
  ios:
    needs: shell
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: preview-shell
          path: mobile-native/generated
      - name: Generate Xcode project
        working-directory: mobile-native/ios
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: Build iPhone Simulator and iOS device archive
        working-directory: mobile-native/ios
        run: |
          xcodebuild -quiet -scheme PathPreview -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/path-ios" CODE_SIGNING_ALLOWED=NO build
          xcodebuild -quiet -scheme PathPreview -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PathPreview.xcarchive" CODE_SIGNING_ALLOWED=NO archive
      - name: Launch and verify the application in an iPhone simulator
        run: |
          set -eo pipefail
          APP="$RUNNER_TEMP/path-ios/Build/Products/Debug-iphonesimulator/PathPreview.app"
          ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for runtime,ds in sorted(json.load(sys.stdin)["devices"].items(),reverse=True) if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$ID" || xcrun simctl list | grep "$ID.*Booted"
          xcrun simctl bootstatus "$ID" -b
          xcrun simctl install "$ID" "$APP"
          xcrun simctl launch "$ID" com.pathyourday.path.preview --path-smoke
          DATA=$(xcrun simctl get_app_container "$ID" com.pathyourday.path.preview data)
          for n in {1..45}; do [[ -f "$DATA/Documents/native-smoke.json" ]] && break; sleep 2; done
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print(r); assert r=={"bundled":True,"locks":True,"login":True,"origin":"https://path-mobile-stfqgdvl.waldek-path.workers.dev"}' "$DATA/Documents/native-smoke.json"
          cmp "$APP/shell.html" mobile-native/generated/shell.html
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP" artifacts/Path-iOS-Simulator.zip
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/PathPreview.xcarchive" artifacts/Path-iOS-Unsigned-Archive.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Path-iOS-Simulator
          path: artifacts/Path-iOS-Simulator.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Path-iOS-Unsigned-Archive
          path: artifacts/Path-iOS-Unsigned-Archive.zip
          retention-days: 30
