function icon(name,size=17){return `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ic[name]||ic.light}</svg>`}
function addDays(date,n){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA').replace(/\//g,'-')}
function iso(d=new Date()){const o=new Date(d);return `${o.getFullYear()}-${String(o.getMonth()+1).padStart(2,'0')}-${String(o.getDate()).padStart(2,'0')}`}
function monOf(s=iso()){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)}
function pretty(s){if(!s)return 'No date';return new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function diffDays(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)}

function quoteToday(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Warsaw',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());let h=0;for(const c of parts)h=(h*31+c.charCodeAt(0))>>>0;return quotes[h%quotes.length]}
function bustHtml(){const q=quoteToday();const dots=[];let rand=19;const random=()=>{rand=(rand*1664525+1013904223)>>>0;return rand/4294967296};for(let j=0;j<43;j++){for(let i=0;i<37;i++){const x=(i-18)/17.5,y=(j-19)/19;const crown=((x+.03)/.61)**2+((y+.32)/.60)**2<1.0;const face=((x+.01)/.48)**2+((y+.18)/.60)**2<1;const neck=Math.abs(x)<.25&&y>.15&&y<.67;const body=(x/.98)**2+((y-.98)/.52)**2<1&&y>.5;const hair=crown&&((x+.02)/.53)**2+((y+.20)/.5)**2>0.75;const beard=face&&y>.08&&Math.abs(x)>.06;const centerEye=(y>-.34&&y<-.28&&Math.abs(x)>.10&&Math.abs(x)<.37);const nose=(Math.abs(x)<.055&&y>-.22&&y<.03);if(!(crown||face||neck||body)||centerEye||nose)continue;const d=random();if(d<.18)continue;const opacity=hair||beard?.85:.50+random()*.43;const r=1.0+random()*.55;const ambient=data.settings.motion!=='off'&&random()<.095;const dx=(random()*2-1)*(data.settings.motion==='expressive'?2.6:1.25);const dy=(random()*2-1)*(data.settings.motion==='expressive'?2.6:1.25);dots.push(`<circle class="particle ${ambient?'ambient':''}" cx="${63+i*5.7}" cy="${21+j*5.7}" r="${r.toFixed(1)}" fill="#f0f0ee" style="--op:${opacity.toFixed(2)};--dx:${dx.toFixed(2)}px;--dy:${dy.toFixed(2)}px;--dur:${(5+random()*7).toFixed(1)}s;--delay:${(-random()*9).toFixed(1)}s;opacity:${opacity.toFixed(2)}"/>`)} }return `<section class="philosopher"><div class="bust"><svg viewBox="0 0 340 295" role="img" aria-label="Animated dotted silhouette of a classical philosopher">${dots.join('')}</svg></div><div class="eyebrow" style="margin-bottom:9px">Daily reflection</div><p class="quote">“${esc(q[0])}”</p><div class="quote-author">— ${esc(q[1])} —</div></section>`}

function workflow(p){const mon=monOf(),cols=timelineScale;const list=p.tasks;const xFrom=date=>diffDays(mon,date)*28;const now=diffDays(mon,iso());return `<div class="board-head"><div><span class="panel-title">Workflow Plan</span><div class="muted" style="font-size:10px;margin-top:3px">Drag tasks from the board here. Drag bars to reschedule; pull right edge to resize.</div></div><div class="row"><button class="btn small ${timelineScale===21?'primary':''}" data-timeline-scale="21">3 weeks</button><button class="btn small ${timelineScale===42?'primary':''}" data-timeline-scale="42">6 weeks</button></div></div><div class="timeline-scroll"><div class="timeline" style="width:${Math.max(930,155+cols*28+16)}px"><div class="timeline-header">${Array.from({length:cols},(_,i)=>`<div class="timeline-day ${addDays(mon,i)===iso()?'today':''}" title="${addDays(mon,i)}">${i%2===0?new Date(addDays(mon,i)+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}):''}</div>`).join('')}</div>${list.map(t=>{const start=t.start?diffDays(mon,t.start):null;const dur=t.start&&t.end?Math.max(1,diffDays(t.start,t.end)+1):1;const l=start===null?-1:start*28;const visible=start!==null&&start<cols&&start+dur>0;const dl=t.deadline?diffDays(mon,t.deadline):null;return `<div class="timeline-row" data-timeline-row="${t.id}"><div class="timeline-grid"></div><div class="timeline-label" title="${esc(t.title)}">${esc(t.title)}</div>${visible?`<div class="timebar ${t.status==='done'?'done':''}" data-timebar="${t.id}" style="left:${155+l}px;width:${Math.max(28,dur*28-4)}px">${esc(t.title)}<div class="resize-handle" data-resize="${t.id}" title="Resize"></div></div>`:''}${dl!==null&&dl>=0&&dl<cols?`<div class="deadline-diamond" title="Deadline: ${pretty(t.deadline)}" data-deadline="${t.id}" style="left:${155+dl*28+8}px"></div>`:''}<div class="timeline-drop" data-timeline-drop="${t.id}" style="pointer-events:auto;background:transparent"></div></div>`}).join('')}${now>=0&&now<cols?`<div class="now-line" style="left:${155+now*28+14}px;top:48px"></div><div class="now-tag" style="left:${155+now*28+14}px;top:47px">Now</div>`:''}</div></div><div class="timeline-help">Workflow periods are not calendar appointments. Deadlines are separate from time blocks.</div>`}

function canvasDetail(c){return `<button class="back-link" data-canvas-back>${icon('left',14)} All Canvases</button>${pageTitle(c.name,'Double-click the grid to add a note. Drag cards to arrange ideas.',`<button class="btn" data-canvas-export>${icon('download')} Export JSON</button>`)}<div class="canvas-wrap"><div class="canvas-tools"><button class="btn small" data-canvas-add="note">${icon('plus')} Note</button><button class="btn small" data-canvas-add="image">${icon('image')} Image</button><button class="btn small" data-canvas-link ${canvasSelected?'':'disabled'}>${icon('link')} ${canvasConnecting?'Select target':'Connect'}</button>${canvasSelected?`<button class="btn small" data-canvas-edit>${icon('edit')} Edit</button><button class="btn small" data-canvas-remove>${icon('trash')} Delete</button>`:''}</div><div class="canvas-space" id="canvas-space"><div class="canvas-world" id="canvas-world"><svg class="canvas-connections" viewBox="0 0 1700 1050">${c.edges.map(e=>{const a=c.nodes.find(n=>n.id===e.from),b=c.nodes.find(n=>n.id===e.to);if(!a||!b)return '';const ax=a.x+110,ay=a.y+55,bx=b.x+110,by=b.y+55;return `<path d="M${ax} ${ay} C${(ax+bx)/2} ${ay},${(ax+bx)/2} ${by},${bx} ${by}" fill="none" stroke="#afb7b3" stroke-width="1.4" opacity=".72"/><circle cx="${bx}" cy="${by}" r="3" fill="#dfe6df"/>`}).join('')}</svg>${c.nodes.map(n=>`<div class="canvas-node ${canvasSelected===n.id?'selected':''}" data-node="${n.id}" style="left:${n.x}px;top:${n.y}px;border-color:${esc(n.color||'#777')}">${n.image?`<img src="${esc(n.image)}" alt="${esc(n.title)}" draggable="false">`:''}<div class="nodetitle">${esc(n.title)}</div><div class="nodetext">${esc(n.body)}</div></div>`).join('')}</div></div><div class="canvas-hint">${canvasConnecting?'Click another card to connect':`Select a card to edit · ${c.nodes.length} nodes`}</div></div>`}
function canvasPage(){const c=data.canvases.find(x=>x.id===canvasId);return c?canvasDetail(c):canvasLibrary()}
function getWeekDates(){let m=monOf();return Array.from({length:7},(_,i)=>addDays(m,i))}
function scheduleGrid(sport=false){const dates=getWeekDates(),hours=Array.from({length:12},(_,i)=>i+8);return `<div class="cal-table"><div class="cal-grid"><div class="cal-cell head">TIME</div>${dates.map(d=>`<div class="cal-cell head">${new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',day:'numeric'})}</div>`).join('')}${hours.map(h=>`<div class="cal-cell time">${String(h).padStart(2,'0')}:00</div>${dates.map(d=>{const occ=data.events.filter(e=>e.date===d&&e.hour<=h&&e.hour+Math.ceil((e.duration||60)/60)>h);const busy=occ.some(e=>e.type==='busy');return `<div class="cal-cell ${busy?'busy':''}" data-cal-day="${d}" data-cal-hour="${h}">${occ.map(e=>`<div class="event-chip ${e.type==='workout'?'workout':''}" data-event="${e.id}" title="${esc(e.title)} (${e.duration} min)">${e.type==='workout'?icon('sport',12):''} ${esc(e.title)} ${h===e.hour?'':'·'}</div>`).join('')}</div>`}).join('')}`).join('')}</div></div><p class="muted" style="font-size:10px;margin-top:10px">${sport?'Drag a workout into a free hour. University events are hatched; drag creates a synced Calendar event.':'This week · appointments and workouts appear together.'}</p>`}
function sportPage(){return `${pageTitle('Sport','Train with intention.',`<button class="btn primary" data-new-workout>${icon('plus')} New workout</button>`)}<div class="sports-layout"><div class="workout-grid">${data.workouts.map(w=>`<div class="workout-card" draggable="true" data-workout-drag="${w.id}" data-workout-edit="${w.id}"><div class="art">${icon(w.icon||'sport',33)}</div><div><strong>${esc(w.name)}</strong><div class="meta">${esc(w.detail)}</div><div class="row meta" style="margin-top:8px">${icon('clock',13)} ${w.duration} min</div></div><span class="spacer"></span>${icon('grip',16)}</div>`).join('')}</div><section class="panel"><div class="panel-head"><span class="panel-title">Training Schedule</span><span class="muted small-text">Synced with Calendar · Europe/Warsaw</span></div>${scheduleGrid(true)}</section></div>`}
function calendarPage(){return `${pageTitle('Calendar','Everything in one place.',`<button class="btn primary" data-new-event>${icon('plus')} New event</button>`)}<section class="panel"><div class="panel-head"><span class="panel-title">Weekly overview</span><span class="muted small-text">Europe/Warsaw · demo data</span></div>${scheduleGrid()}</section>`}
function progressPage(){const all=data.projects.flatMap(p=>p.tasks),done=all.filter(t=>t.status==='done').length;return `${pageTitle('Progress','Your actions leave a trace.')}<div class="kpi-strip"><div class="kpi"><div class="number">${done}</div><div class="desc">COMPLETED PROJECT TASKS</div></div><div class="kpi"><div class="number">${data.homeTasks.filter(t=>t.done).length}</div><div class="desc">DONE TODAY</div></div><div class="kpi"><div class="number">${data.events.filter(e=>e.type==='workout').length}</div><div class="desc">SCHEDULED WORKOUTS</div></div></div><section class="panel"><div class="panel-head"><span class="panel-title">Project journeys</span><span class="muted small-text">Measured by completed tasks</span></div>${data.projects.map(p=>`<div style="margin-bottom:19px"><div class="row" style="margin-bottom:8px"><span>${esc(p.name)}</span><span class="spacer"></span><span class="muted">${projectPercent(p)}%</span></div><div class="thin-progress"><div class="fill" style="width:${projectPercent(p)}%"></div></div></div>`).join('')}</section>`}
function settingsPage(){return `${pageTitle('Settings','Make the path yours.')}<div class="settings-grid"><div class="setting-item"><div><strong>Ambient Motion</strong><div class="details">Subtle movement of the philosopher's dots.</div></div><select class="select" data-motion><option value="off" ${data.settings.motion==='off'?'selected':''}>Off</option><option value="subtle" ${data.settings.motion==='subtle'?'selected':''}>Subtle</option><option value="expressive" ${data.settings.motion==='expressive'?'selected':''}>Expressive</option></select></div><div class="setting-item"><div><strong>Export test data</strong><div class="details">Download projects, boards and events as JSON.</div></div><button class="btn" data-export>${icon('download')} Export</button></div><div class="setting-item"><div><strong>Import test data</strong><div class="details">Restore a JSON file exported from this prototype.</div></div><button class="btn" data-import>${icon('upload')} Import</button></div><div class="setting-item"><div><strong>Reset prototype</strong><div class="details">Erase only the test data stored in this browser.</div></div><button class="btn" data-reset>${icon('trash')} Reset</button></div></div><p class="muted" style="margin-top:25px;font-size:11px">This build has no accounts or cloud sync. Data is stored locally in your current browser. It does not read or modify your original Path.</p>`}
function render(){const oldSpace=$('#canvas-space');if(oldSpace&&view==='canvas')canvasScroll={left:oldSpace.scrollLeft,top:oldSpace.scrollTop};const app=$('#app');const fn={today:todayPage,projects:projectsPage,canvas:canvasPage,sport:sportPage,calendar:calendarPage,progress:progressPage,settings:settingsPage}[view]||todayPage;app.innerHTML=`<div class="shell">${navMarkup()}<main class="app-main">${header()}${fn()}<footer class="muted" style="margin-top:55px;font-size:10px;border-top:1px solid #27282a;padding-top:16px">Path 2.0 · standalone experimental prototype · local data only · not connected to path.invalid</footer></main></div>`;if(canvasId&&view==='canvas'){const space=$('#canvas-space');if(space){space.scrollLeft=canvasScroll.left;space.scrollTop=canvasScroll.top}}if(editor)renderEditor()}
function openEditor(title,fields,saveFn,deleteFn){editor={title,fields,saveFn,deleteFn};renderEditor()}
function closeEditor(){editor=null;$('#editor-overlay')?.remove()}
function renderEditor(){let overlay=$('#editor-overlay');if(overlay)overlay.remove();overlay=document.createElement('div');overlay.id='editor-overlay';overlay.className='editor-overlay';overlay.innerHTML=`<div class="editor" role="dialog" aria-modal="true" aria-label="${esc(editor.title)}"><div class="editor-head"><strong>${esc(editor.title)}</strong><button class="btn ghost icon-only" data-close-editor aria-label="Close">${icon('close')}</button></div><form id="editor-form">${editor.fields.map(f=>`<div class="field"><label for="f_${f.key}">${esc(f.label)}</label>${f.type==='select'?`<select id="f_${f.key}" name="${f.key}">${f.options.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(f.value)?'selected':''}>${esc(l)}</option>`).join('')}</select>`:f.type==='textarea'?`<textarea id="f_${f.key}" name="${f.key}">${esc(f.value||'')}</textarea>`:`<input id="f_${f.key}" name="${f.key}" type="${f.type||'text'}" ${f.required?'required':''} ${f.min?'min="'+f.min+'"':''} ${f.max?'max="'+f.max+'"':''} value="${esc(f.value||'')}">`}</div>`).join('')}<div class="editor-actions"><button type="submit" class="btn primary">${icon('check')} Save changes</button><button type="button" class="btn" data-close-editor>Cancel</button>${editor.deleteFn?`<button type="button" style="margin-left:auto" class="btn" data-editor-delete>${icon('trash')}</button>`:''}</div></form></div>`;overlay.addEventListener('click',e=>{if(e.target===overlay)closeEditor()});document.body.appendChild(overlay);$('#editor-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget);const values=Object.fromEntries(f.entries());editor.saveFn(values);closeEditor();save();render();toast('Saved to this browser')});}
function modalProject(){openEditor('Create project',[{key:'name',label:'Project name',required:true},{key:'description',label:'Description'},{key:'type',label:'Icon',type:'select',value:'project',options:[['project','Board'],['video','Video'],['game','Game'],['web','Website'],['light','Idea']]}],v=>{const p={id:uid(),name:v.name.trim(),description:v.description,type:v.type,tasks:[]};data.projects.push(p);projectId=p.id})}
function modalTask(status='planned',id=null){const p=data.projects.find(x=>x.id===projectId);if(!p)return;const task=p.tasks.find(x=>x.id===id);openEditor(task?'Edit task':'New task',[{key:'title',label:'Title',required:true,value:task?.title},{key:'description',label:'Description',type:'textarea',value:task?.description},{key:'status',label:'Status',type:'select',value:task?.status||status,options:[['planned','Planned'],['progress','In Progress'],['done','Done']]},{key:'start',label:'Start date',type:'date',value:task?.start},{key:'end',label:'End date',type:'date',value:task?.end},{key:'deadline',label:'Deadline (independent of workflow dates)',type:'date',value:task?.deadline},{key:'estimate',label:'Estimated hours',type:'number',min:'0',value:task?.estimate||1},{key:'progress',label:'Progress %',type:'number',min:'0',max:'100',value:task?.progress||0}],v=>{if(v.start&&v.end&&v.end<v.start){toast('End date must not precede start date');return}if(task)Object.assign(task,{...v,estimate:Number(v.estimate)||1,progress:v.status==='done'?100:Number(v.progress)||0});else p.tasks.push({id:uid(),...v,estimate:Number(v.estimate)||1,progress:v.status==='done'?100:Number(v.progress)||0})},task?()=>{p.tasks=p.tasks.filter(t=>t.id!==task.id)}:null)}
function modalWorkout(id=null){const w=data.workouts.find(x=>x.id===id);openEditor(w?'Edit workout':'New workout',[{key:'name',label:'Workout name',required:true,value:w?.name},{key:'detail',label:'Muscle groups or description',value:w?.detail},{key:'duration',label:'Duration (minutes)',type:'number',min:'15',value:w?.duration||60},{key:'icon',label:'Illustration',type:'select',value:w?.icon||'sport',options:[['sport','Dumbbell'],['focus','Movement'],['spark','Mobility'],['sun','Outdoor']]}],v=>{if(w)Object.assign(w,{...v,duration:Math.max(15,Number(v.duration)||60)});else data.workouts.push({id:uid(),...v,duration:Math.max(15,Number(v.duration)||60)})},w?()=>{data.workouts=data.workouts.filter(x=>x.id!==w.id)}:null)}
function modalEvent(id=null){const e=data.events.find(x=>x.id===id);openEditor(e?'Edit event':'New event',[{key:'title',label:'Title',required:true,value:e?.title},{key:'date',label:'Date',type:'date',required:true,value:e?.date||iso()},{key:'hour',label:'Start hour (8–19)',type:'number',min:'8',max:'19',value:e?.hour??10},{key:'duration',label:'Duration (minutes)',type:'number',min:'15',value:e?.duration||60},{key:'type',label:'Type',type:'select',value:e?.type||'busy',options:[['busy','Busy'],['workout','Workout']]}],v=>{const x={...v,hour:Math.max(8,Math.min(19,Number(v.hour)||8)),duration:Math.max(15,Number(v.duration)||60)};if(e)Object.assign(e,x);else data.events.push({id:uid(),...x})},e?()=>{data.events=data.events.filter(x=>x.id!==e.id)}:null)}
function modalNode(){const c=data.canvases.find(x=>x.id===canvasId),n=c?.nodes.find(x=>x.id===canvasSelected);if(!n)return;openEditor('Canvas card',[{key:'title',label:'Card title',required:true,value:n.title},{key:'body',label:'Notes',type:'textarea',value:n.body},{key:'color',label:'Border color',type:'select',value:n.color,options:[['#9a9fa3','Silver'],['#8ba79a','Sage'],['#a9a6bc','Lavender'],['#baa18f','Sand'],['#c7c7c7','White']]}],v=>Object.assign(n,v))}
function fileDownload(name,blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function jsonDownload(name,o){fileDownload(name,new Blob([JSON.stringify(o,null,2)],{type:'application/json'}))}
function newCanvasNode(type,x=180,y=200){const c=data.canvases.find(x=>x.id===canvasId);if(!c)return;const n={id:uid(),x,y,title:type==='image'?'Image':'New note',body:type==='image'?'Choose Edit to write a caption.':'Double-click to edit this note.',color:'#9a9fa3'};c.nodes.push(n);canvasSelected=n.id;save();render();if(type==='image')selectImageFile(n);else modalNode()}
function selectImageFile(n){const input=document.createElement('input');input.type='file';input.accept='image/png,image/jpeg,image/webp';input.onchange=()=>{const file=input.files?.[0];if(!file)return;if(file.size>800000){toast('Use an image smaller than 800 KB for local storage.');return}const reader=new FileReader();reader.onload=()=>{n.image=String(reader.result);n.title=file.name;save();render();toast('Image added')};reader.readAsDataURL(file)};input.click()}
function isBusy(date,hour,duration){return data.events.some(e=>e.date===date&&e.hour*60<(hour*60+duration)&&e.hour*60+(e.duration||60)>hour*60)}
function placeWorkout(id,date,hour){const w=data.workouts.find(x=>x.id===id);if(!w)return;if(isBusy(date,hour,w.duration)){toast('Time conflict. Choose a free time.');return}data.events.push({id:uid(),title:w.name,date,hour,duration:w.duration,type:'workout',workoutId:w.id});save();render();toast('Workout scheduled in both calendars')}
function importJson(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const v=JSON.parse(await input.files[0].text());if(!v||!Array.isArray(v.projects)||!Array.isArray(v.events)||!Array.isArray(v.canvases)||!Array.isArray(v.workouts)||!Array.isArray(v.homeTasks)||!Array.isArray(v.habits))throw Error('Not a Path beta export');if(confirm('Replace all current beta data with the imported file?')){data=v;save();render();toast('Beta data imported')}}catch(e){toast('Could not import: '+e.message)}};input.click()}
function action(e){const target=e.target.closest('[data-nav],[data-add-home],[data-home-toggle],[data-home-delete],[data-habit],[data-filter-done],[data-focus],[data-new-project],[data-project-open],[data-project-back],[data-new-task],[data-task-edit],[data-timeline-scale],[data-new-canvas],[data-canvas-open],[data-canvas-back],[data-canvas-add],[data-canvas-link],[data-canvas-edit],[data-canvas-remove],[data-canvas-export],[data-node],[data-new-workout],[data-workout-edit],[data-event],[data-new-event],[data-export],[data-import],[data-reset],[data-close-editor],[data-editor-delete]');if(!target)return;const d=target.dataset;if('nav'in d){view=d.nav;projectId=null;canvasId=null;canvasSelected=null;focusMode=false;render();return}if('addHome'in d){openEditor('Quick task',[{key:'title',label:'Task title',required:true}],v=>data.homeTasks.push({id:uid(),title:v.title,done:false}));return}if(d.homeToggle){mutate(()=>{const t=data.homeTasks.find(x=>x.id===d.homeToggle);if(t)t.done=!t.done});return}if(d.homeDelete){mutate(()=>data.homeTasks=data.homeTasks.filter(x=>x.id!==d.homeDelete));return}if(d.habit){mutate(()=>{const h=data.habits.find(x=>x.id===d.habit);if(h)h.done=!h.done});return}if('filterDone'in d){showCompleted=!showCompleted;render();return}if('focus'in d){focusMode=!focusMode;render();return}if('newProject'in d){modalProject();return}if(d.projectOpen){projectId=d.projectOpen;render();return}if('projectBack'in d){projectId=null;render();return}if(d.newTask){modalTask(d.newTask);return}if(d.taskEdit){if(e.type==='click')modalTask('planned',d.taskEdit);return}if(d.timelineScale){timelineScale=Number(d.timelineScale);render();return}if('newCanvas'in d){canvasScroll={left:55,top:75};openEditor('New Canvas',[{key:'name',label:'Canvas name',required:true}],v=>{const c={id:uid(),name:v.name,nodes:[],edges:[]};data.canvases.push(c);canvasId=c.id;canvasSelected=null});return}if(d.canvasOpen){canvasId=d.canvasOpen;canvasSelected=null;canvasScroll={left:55,top:75};render();return}if('canvasBack'in d){canvasId=null;canvasSelected=null;render();return}if(d.canvasAdd){newCanvasNode(d.canvasAdd);return}if('canvasLink'in d){canvasConnecting=canvasSelected;toast('Select another card to connect');return}if('canvasEdit'in d){modalNode();return}if('canvasRemove'in d){const c=data.canvases.find(x=>x.id===canvasId);mutate(()=>{c.nodes=c.nodes.filter(x=>x.id!==canvasSelected);c.edges=c.edges.filter(x=>x.from!==canvasSelected&&x.to!==canvasSelected);canvasSelected=null});return}if('canvasExport'in d){const c=data.canvases.find(x=>x.id===canvasId);jsonDownload((c.name||'canvas')+'.json',{nodes:c.nodes,edges:c.edges});return}if(d.node){if(canvasConnecting&&canvasConnecting!==d.node){mutate(()=>{const c=data.canvases.find(x=>x.id===canvasId);if(!c.edges.some(x=>x.from===canvasConnecting&&x.to===d.node))c.edges.push({from:canvasConnecting,to:d.node});canvasSelected=d.node;canvasConnecting=null})}else{canvasSelected=d.node;render()}return}if('newWorkout'in d){modalWorkout();return}if(d.workoutEdit){modalWorkout(d.workoutEdit);return}if('newEvent'in d){modalEvent();return}if(d.event){modalEvent(d.event);return}if('export'in d){jsonDownload('path2-beta-data.json',data);return}if('import'in d){importJson();return}if('reset'in d){if(confirm('Reset all TEST data in this browser? Main Path is unaffected.')){data=demo();projectId=null;canvasId=null;save();render();toast('Beta data reset')}return}if('closeEditor'in d){closeEditor();return}if('editorDelete'in d){if(confirm('Delete this item?')){editor.deleteFn();closeEditor();save();render()}return}}
document.addEventListener('click',action);
document.addEventListener('change',e=>{if(e.target.matches('[data-motion]'))mutate(()=>{data.settings.motion=e.target.value})});
document.addEventListener('dblclick',e=>{const node=e.target.closest('[data-node]');if(node){canvasSelected=node.dataset.node;modalNode();return}const world=e.target.closest('#canvas-world');if(world){const r=world.getBoundingClientRect();newCanvasNode('note',Math.round(e.clientX-r.left),Math.round(e.clientY-r.top))}});
let dnd=null;
document.addEventListener('dragstart',e=>{const task=e.target.closest('[data-task-drag]'),w=e.target.closest('[data-workout-drag]');if(task){dnd={type:'task',id:task.dataset.taskDrag};e.dataTransfer.setData('text/plain','task:'+dnd.id);e.dataTransfer.effectAllowed='move'}else if(w){dnd={type:'workout',id:w.dataset.workoutDrag};e.dataTransfer.setData('text/plain','workout:'+dnd.id);e.dataTransfer.effectAllowed='copy'}});
document.addEventListener('dragover',e=>{const cell=e.target.closest('[data-cal-day]'),row=e.target.closest('[data-timeline-row]'),col=e.target.closest('[data-status-col]');if((dnd?.type==='workout'&&cell)||(dnd?.type==='task'&&(row||col))){e.preventDefault();e.dataTransfer.dropEffect=dnd.type==='task'?'move':'copy';cell?.classList.add('dropover')}});

document.addEventListener('drop',e=>{const cell=e.target.closest('[data-cal-day]'),row=e.target.closest('[data-timeline-row]'),col=e.target.closest('[data-status-col]');if(dnd?.type==='workout'&&cell){e.preventDefault();placeWorkout(dnd.id,cell.dataset.calDay,Number(cell.dataset.calHour));dnd=null;return}if(dnd?.type==='task'&&col){e.preventDefault();const p=data.projects.find(x=>x.id===projectId),t=p?.tasks.find(x=>x.id===dnd.id);if(t){t.status=col.dataset.statusCol;if(t.status==='done')t.progress=100;save();render();toast('Task status updated')}dnd=null;return}if(dnd?.type==='task'&&row){e.preventDefault();const p=data.projects.find(x=>x.id===projectId),t=p?.tasks.find(x=>x.id===dnd.id);if(t){const grid=row.getBoundingClientRect(),left=e.clientX-grid.left-155;const days=Math.min(timelineScale-1,Math.max(0,Math.floor(left/28)));t.start=addDays(monOf(),days);t.end=addDays(t.start,2);save();render();toast('Workflow dates assigned')}dnd=null;return}dnd=null});
let pointerOp=null;
document.addEventListener('pointerdown',e=>{if(e.button!==0)return;const bar=e.target.closest('[data-timebar]'),node=e.target.closest('[data-node]');if(bar&&view==='projects'){const p=data.projects.find(x=>x.id===projectId),t=p?.tasks.find(x=>x.id===bar.dataset.timebar);if(!t)return;pointerOp={type:e.target.closest('[data-resize]')?'resize':'move',id:t.id,p,t,startX:e.clientX,oldStart:t.start,oldEnd:t.end,el:bar};bar.setPointerCapture(e.pointerId);bar.classList.add('dragging');e.preventDefault()}else if(node&&view==='canvas'){if(e.target.closest('button'))return;const c=data.canvases.find(x=>x.id===canvasId),n=c?.nodes.find(x=>x.id===node.dataset.node);if(!n)return;pointerOp={type:'node',n,startX:e.clientX,startY:e.clientY,oldX:n.x,oldY:n.y,el:node};node.setPointerCapture(e.pointerId);e.preventDefault()}});
document.addEventListener('pointermove',e=>{if(!pointerOp)return;const op=pointerOp;if(op.type==='node'){const dx=e.clientX-op.startX,dy=e.clientY-op.startY;op.el.style.left=Math.max(0,op.oldX+dx)+'px';op.el.style.top=Math.max(0,op.oldY+dy)+'px'}else{const days=Math.round((e.clientX-op.startX)/28);if(op.type==='move'){op.el.style.transform=`translateX(${days*28}px)`}else if(op.type==='resize'){op.el.style.width=Math.max(28,(diffDays(op.oldStart,op.oldEnd)+1+days)*28-4)+'px'}}});
document.addEventListener('pointerup',e=>{if(!pointerOp)return;const op=pointerOp;pointerOp=null;if(op.type==='node'){op.n.x=Math.max(0,Math.round(op.oldX+e.clientX-op.startX));op.n.y=Math.max(0,Math.round(op.oldY+e.clientY-op.startY));canvasSelected=op.n.id;save();render();return}const days=Math.round((e.clientX-op.startX)/28);if(days===0){op.el.classList.remove('dragging');return}if(op.type==='move'){op.t.start=addDays(op.oldStart,days);op.t.end=addDays(op.oldEnd,days)}else if(op.type==='resize'){op.t.end=addDays(op.oldEnd,Math.max(1-diffDays(op.oldStart,op.oldEnd)-1,days))}save();render();toast('Workflow updated')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&editor)closeEditor()});
save();render();
</script></body></html>
